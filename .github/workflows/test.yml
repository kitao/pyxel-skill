name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest skills-ref uv "mcp>=2,<3"
      - run: pytest -q
      - name: Validate against the Agent Skills specification
        run: |
          mkdir -p /tmp/skills
          cp -R "$PWD" /tmp/skills/pyxel
          agentskills validate /tmp/skills/pyxel
